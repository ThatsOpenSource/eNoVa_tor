# PostgreSQL for Enova EGOV – host port 55432 avoids clashes with other local Postgres instances
services:
  enova-db:
    image: postgres:16-alpine
    container_name: enova_tor
    restart: unless-stopped
    environment:
      POSTGRES_DB: enova
      POSTGRES_USER: enova
      POSTGRES_PASSWORD: "1234"
    ports:
      - "55432:5432"
    volumes:
      - enova_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enova -d enova"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  enova_pgdata:

